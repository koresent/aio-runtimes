name: Build Installer Package

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        lfs: true

    - name: Create Archive
      run: |
        Compress-Archive -Path Redist -DestinationPath aio-runtimes.zip -Force

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v1
      with:
        tag_name: latest
        name: Latest Build
        draft: false
        prerelease: false
        files: aio-runtimes.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}